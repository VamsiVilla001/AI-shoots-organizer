[package]
name = "teo-video-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scene detection and frame sampling for video face recognition"
build = "build.rs"

[dependencies]
teo-media-core = { path = "../media-core" }
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
tracing = "0.1"
thiserror = "2.0"

[build-dependencies]
cc = "1.2"

[features]
default = []
# Builds the small native optical-flow bridge against a local OpenCV SDK.
# The normal FFmpeg/SCRFD/ArcFace path remains available without this feature.
opencv-tracking = []

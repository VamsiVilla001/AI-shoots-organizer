[package]
name = "teo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless HTTP front door for the Esports AI Media Organiser core"

[lib]
name = "teo_server"
path = "src/lib.rs"

[[bin]]
name = "teo-server"
path = "src/main.rs"

[dependencies]
teo-app-core = { path = "../app-core" }
teo-database = { path = "../database" }
teo-export-engine = { path = "../export-engine" }

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "teo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless HTTP front door for the Esports AI Media Organiser core"

[lib]
name = "teo_server"
path = "src/lib.rs"

[[bin]]
name = "teo-server"
path = "src/main.rs"

[dependencies]
teo-app-core = { path = "../app-core" }
teo-database = { path = "../database" }
teo-export-engine = { path = "../export-engine" }
teo-face-detection = { path = "../face-detection" }
teo-media-core = { path = "../media-core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
num_cpus = "1.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"

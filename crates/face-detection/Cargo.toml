[package]
name = "teo-face-detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ONNX-based face detection (SCRFD) with a swappable detector interface"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
image = "0.25"
tracing = "0.1"
num_cpus = "1.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-27",
] }

# The GPU provider that ships with the operating system is enabled by target
# rather than by cargo feature, because on measured hardware it is worth ~42x
# (859 faces/sec vs 20 on CPU) and nobody should have to opt into that. Both
# are OS components — DirectML since Windows 10 1903, CoreML on macOS — and
# ONNX Runtime falls back to the CPU provider when neither can start.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

[features]
default = []
# CUDA stays opt-in: unlike the above it needs a toolkit installed separately.
cuda = ["ort/cuda"]
# Kept so the workspace's own feature flags still resolve; the providers are
# already on for their platform.
directml = []
coreml = []

[package]
name = "skwad-database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite storage layer for the SKWAD Media Organiser"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
tracing = "0.1"

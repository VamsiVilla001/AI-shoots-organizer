[package]
name = "teo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Esports AI Media Organiser desktop application"
default-run = "teo-desktop"

[lib]
# Deliberately not `teo_desktop`: the bin target of the same name would emit a
# `teo_desktop.pdb` to the same path, which Cargo warns about today and will
# reject outright in future.
name = "teo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Deliberately none of the AI or database crates: the shell starts `teo-server`
# and talks to it over loopback, so it links none of the work. That also keeps
# `cargo build -p teo-desktop` from rebuilding ONNX Runtime.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27"

[features]
default = []
# Acceleration is the server's business now: it links the AI crates, and the
# providers are enabled by target there. Kept as no-ops so existing build
# commands do not break.
directml = []
coreml = []
cuda = []

[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/app-core",
    "crates/clustering",
    "crates/database",
    "crates/export-engine",
    "crates/face-detection",
    "crates/face-recognition",
    "crates/media-core",
    "crates/server",
    "crates/video-analysis",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
teo-app-core = { path = "crates/app-core" }
teo-clustering = { path = "crates/clustering" }
teo-database = { path = "crates/database" }
teo-export-engine = { path = "crates/export-engine" }
teo-face-detection = { path = "crates/face-detection" }
teo-face-recognition = { path = "crates/face-recognition" }
teo-media-core = { path = "crates/media-core" }
teo-server = { path = "crates/server" }
teo-video-analysis = { path = "crates/video-analysis" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# AI inference is unusably slow in a debug build; always optimise the heavy
# crates. `"*"` covers third-party dependencies but **not workspace members**,
# so our own crates need naming individually — without this they compile at
# opt-level 0 during `npm run dev`, which measured 5x slower face alignment,
# 20x slower cosine similarity and 33x slower kNN graph building.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.teo-app-core]
opt-level = 3
[profile.dev.package.teo-clustering]
opt-level = 3
[profile.dev.package.teo-database]
opt-level = 3
[profile.dev.package.teo-export-engine]
opt-level = 3
[profile.dev.package.teo-face-detection]
opt-level = 3
[profile.dev.package.teo-face-recognition]
opt-level = 3
[profile.dev.package.teo-media-core]
opt-level = 3
[profile.dev.package.teo-server]
opt-level = 3
[profile.dev.package.teo-video-analysis]
opt-level = 3

name: Release

# Builds the installers on GitHub's machines and attaches them to a release.
#
# macOS cannot be cross-compiled from Windows: the .dmg needs Apple's toolchain
# and, for a signed build, `codesign`. So the Mac builds run on GitHub's macOS
# runners — one Apple Silicon .dmg and one Intel .dmg — and the Windows
# installer is built alongside so a release carries all three from one commit.
#
# How to release:
#
#   git push origin release/beta-v1.0.0
#       -> EVERY commit on a release/<tag> branch builds all three and puts
#          them on the pre-release for <tag>, moving the tag to that commit.
#          Nothing else to do: commit, push, and the installers follow.
#   git tag beta-v1.0.1 && git push origin beta-v1.0.1
#       -> builds all three, publishes a pre-release named after the tag
#   git tag v1.0.0 && git push origin v1.0.0
#       -> builds all three, creates a DRAFT release for you to check and publish
#   Actions -> Release -> Run workflow
#       -> builds all three as run artefacts; give it a tag name to attach
#          them to that tag's release instead
#
# The artefacts are UNSIGNED unless the Apple secrets below are set. macOS
# refuses to open an unsigned .dmg from a download without right-click -> Open
# (or `xattr -d com.apple.quarantine`), and Windows SmartScreen warns. See
# docs/deployment.md, "Signing".

on:
  push:
    tags: ["v*", "beta-*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      with_models:
        description: "Bundle the ~191 MB face models into the installers"
        type: boolean
        default: true
      release_tag:
        description: "Attach the installers to this existing tag's release (leave empty for run artefacts only)"
        type: string
        default: ""

permissions:
  contents: write # needed to create the release and upload assets

# A newer push to the same branch cancels the build still running for the
# previous one, so the release always ends up matching the latest commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tag and branch builds always bundle the models; a manual run chooses.
  WITH_MODELS: ${{ github.event_name == 'push' || inputs.with_models }}
  # Which release the installers go to — the tag pushed, the branch's tag
  # (release/beta-v1.0.0 -> beta-v1.0.0), or what a manual run asked for —
  # is worked out by the "Release tag" step in each job.
  RELEASE_TAG_INPUT: ${{ inputs.release_tag }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: skwad-macos-arm64
            suffix: macos-arm64.dmg
            # Native: the runner is arm64, so no --target is needed.
            target: ""
            bundles: target/release/bundle/dmg/*.dmg
          - os: macos-14
            label: macOS (Intel)
            artifact: skwad-macos-x64
            suffix: macos-x64.dmg
            # Cross-built on the same arm64 runner for 2019-era Intel Macs.
            target: x86_64-apple-darwin
            bundles: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows x64
            artifact: skwad-windows-x64
            suffix: x64-setup.exe
            target: ""
            bundles: target/release/bundle/nsis/*.exe

    steps:
      # release/beta-v1.0.0 -> beta-v1.0.0; a tag is itself; a manual run
      # says. Empty means "artefacts only, no release".
      - name: Release tag
        shell: bash
        run: |
          tag="$RELEASE_TAG_INPUT"
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*) [ -z "$tag" ] && tag="${GITHUB_REF#refs/heads/release/}" ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release tag: ${tag:-<none>}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The Rust build dominates the job; without this every run is ~20 minutes
      # of recompiling ONNX Runtime and Tauri from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      # `npm ci` is exact and fast; when the lock file has drifted from a
      # package.json it falls back to a plain install rather than failing the
      # release — the lock file is committed, so this is a safety net.
      - name: Install dependencies
        shell: bash
        run: npm ci || npm install --no-audit --no-fund

      # The two ONNX files are ~191 MB and take the installer from ~11 MB to
      # ~190 MB. Without them the app indexes, sorts and exports; only face
      # recognition needs them, and Settings says so.
      - name: Fetch face models
        if: env.WITH_MODELS == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -ExecutionPolicy Bypass -File scripts/fetch-models.ps1
          else
            bash scripts/fetch-models.sh
          fi

      # `build` / `build:models` package the Premiere panel, build and stage
      # `skwad-server` beside the app (under server/ in the bundle), then build
      # the desktop with the config overlays. For the Intel Mac the server is
      # cross-built too: CARGO_BUILD_TARGET steers cargo and the staging
      # script, --target steers Tauri.
      - name: Build installer
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          # Optional code signing; every one of these may be left unset.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          script=$([ "$WITH_MODELS" = "true" ] && echo build:models || echo build)
          if [ -n "${{ matrix.target }}" ]; then
            npm run "$script" -- --target "${{ matrix.target }}"
          else
            npm run "$script"
          fi

      # One predictable name per platform, so the release page reads well and
      # a re-run replaces the same asset rather than adding another.
      - name: Name the installer
        id: name
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then tag="$(node -p "require('./package.json').version")"; fi
          mkdir -p dist-release
          for f in ${{ matrix.bundles }}; do
            cp "$f" "dist-release/SKWAD-Media-Organiser-${tag}-${{ matrix.suffix }}"
          done
          ls -la dist-release
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    # A tag push and a release-branch push publish; a manual run does only
    # when given a tag.
    if: ${{ needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') || inputs.release_tag != '') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # release/beta-v1.0.0 -> beta-v1.0.0; a tag is itself; a manual run
      # says. Empty means "artefacts only, no release".
      - name: Release tag
        shell: bash
        run: |
          tag="$RELEASE_TAG_INPUT"
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            refs/heads/release/*) [ -z "$tag" ] && tag="${GITHUB_REF#refs/heads/release/}" ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "release tag: ${tag:-<none>}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release-branch push moves the branch's tag to this commit, so the
      # release page and the installers always describe the same code.
      - name: Point the tag at this commit
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$RELEASE_TAG" -m "$RELEASE_TAG — built from ${GITHUB_SHA::7}"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Attach the installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          # beta-* goes out at once as a pre-release; v* lands as a draft for
          # a last look before publishing.
          draft: ${{ startsWith(env.RELEASE_TAG, 'v') }}
          prerelease: ${{ startsWith(env.RELEASE_TAG, 'beta-') }}
          name: ${{ env.RELEASE_TAG }}
          files: artefacts/**/*
          generate_release_notes: true
          append_body: true
          body: |
            ## Installing

            **Windows:** run the `-x64-setup.exe`. SmartScreen will warn because the
            build is unsigned; choose *More info → Run anyway*.

            **macOS:** open the `.dmg` for your Mac — `macos-arm64` for Apple Silicon
            (M1 and later), `macos-x64` for Intel — and drag SKWAD to Applications.
            The build is unsigned, so the first launch is *right-click → Open*, or:

            ```
            xattr -d com.apple.quarantine "/Applications/SKWAD Media Organiser.app"
            ```

            **Server:** one machine runs `skwad-server` (shipped inside the install,
            under `server/`) and needs PostgreSQL 15 or newer:

            ```
            winget install PostgreSQL.PostgreSQL.17     # Windows
            brew install postgresql@17                  # macOS
            npm run db:setup                            # role, databases, password file
            ```

            Every other machine only needs the server's address (choose "Or use a
            SKWAD server" on first launch). See `docs/deployment.md`.

            **FFmpeg** is not bundled; it is needed for video, HEIC and camera RAW.
            The face models are bundled in these installers.

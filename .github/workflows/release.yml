name: Release

# Builds the Windows and macOS installers.
#
# macOS cannot be cross-compiled: the .dmg needs Apple's toolchain and, for a
# signed build, `codesign`. So a Mac has to build it, and unless you have one to
# hand that Mac is a `macos-14` runner — which is Apple Silicon, the same
# architecture as a Mac Studio, so the .dmg it produces is native arm64.
#
#   git tag v2.0.0 && git push origin v2.0.0   -> both installers, draft release
#   Actions -> Release -> Run workflow         -> both installers as run artefacts
#
# The artefacts are UNSIGNED. macOS will refuse to open an unsigned .dmg from a
# download without a right-click -> Open, and Windows SmartScreen will warn. See
# docs/deployment.md for wiring signing secrets in.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      with_models:
        description: "Bundle the ~191 MB face models into the installers"
        type: boolean
        default: false

permissions:
  contents: write # needed to create the draft release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other one works.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: skwad-macos-arm64
            bundles: |
              target/release/bundle/dmg/*.dmg
          - os: windows-latest
            label: Windows x64
            artifact: skwad-windows-x64
            bundles: |
              target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The Rust build dominates the job; without this every run is ~20 minutes
      # of recompiling ONNX Runtime and Tauri from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: npm ci

      # Opt-in, and off by default: the two ONNX files are ~191 MB, which is
      # most of the installer's weight. Without them the app still runs — it
      # indexes, sorts and exports; only face recognition needs them, and
      # Settings says so.
      - name: Fetch face models
        if: inputs.with_models
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -ExecutionPolicy Bypass -File scripts/fetch-models.ps1
          else
            bash scripts/fetch-models.sh
          fi

      # Runs `package:premiere-panel` first, so a release can never ship
      # without the .ccx the panel installer needs.
      - name: Build installer
        run: npm run build

      - name: Collect artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    # Only a tag produces a release; a manual run just leaves the artefacts on
    # the run, which is what you want for a test build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Draft a release with both installers
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artefacts/**/*
          generate_release_notes: true
          body: |
            ## Before installing

            **PostgreSQL 15 or newer must be running before first launch.** The
            library index lives in a database server rather than an embedded
            file, so without one the app opens and reports that it cannot reach
            the library. On the machine that will hold the library:

            ```
            winget install PostgreSQL.PostgreSQL.17     # Windows
            brew install postgresql@17                  # macOS
            npm run db:setup                            # role, databases, password file
            ```

            Upgrading from a build older than this one? Your library is a
            `media.db` file — bring it across with `npm run db:migrate`, and see
            [bringing an old SQLite library across](docs/development.md#bringing-an-old-sqlite-library-across).

            **FFmpeg** is still not bundled; it is needed for video, HEIC and
            camera RAW. **Face models** are bundled only when the build asked
            for them — otherwise fetch them once and Settings will find them.

            These artefacts are unsigned.
